   <!-- homepage -->
   <div class="background" id="home">

      <!-- navbar -->

      <nav class="site_nav">
         <div class="container nav_container">
            <a class="nav_brand" href="#home" aria-label="Abdoul dev — accueil">Abdoull <span>dev</span></a>
            <input class="nav_toggle" type="checkbox" id="nav-toggle">
            <label class="nav_menu_button" for="nav-toggle" aria-label="Ouvrir le menu"><span></span><span></span><span></span></label>
            <div class="navitems">
               <a class="nav_link" href="#home">Accueil</a>

      <!-- introsection -->
      <section class="intro">
         <div class="container intro_container">
            <div class="row intro_boxes">
               <div class="col-lg-6 col-md-12 intro_box1" data-aos="fade-in-left">
                  <div class="name_bio">
                     <p class="name" data-profil="nom">Abdoul dev</p>
                     <p class="bio" data-profil="bio"></p>
                  </div>
               </div>
               <div class="col-lg-6 col-md-12 intro_box2 animate__animated animate__fadeInRight">
                  <div class="box2_profile">
                     <div class="profile_frame">
                        <img class="profile_photo" src="https://abdoul.e-webcode.fr/abdoul.png" alt="Abdoul dev">
                     </div>
                  </div>
               </div>
            </div>
         </div>
      </section>


   </div>


   <div class="fron_project_to_end">
      <!-- project -->

      <section class="project" id="project">
         <div class="project_heading" data-profil="titre_realisations">Quelques travaux</div>
         <div class="project_box">
            <div class="container" id="projets">
               <!-- Les réalisations sont générées depuis data/projets.json (voir content.js) -->
               <p class="project_loading">Chargement des réalisations…</p>
            </div>




         </div>
      </section>

      <!-- skills -->
      <section class="skill_section" id="expertise">
         <div class="skill_heading">

         </div>

         <div class="expertise_grid" data-profil="expertise"></div>
      </section>




      <!-- contact -->
      <section class="main_contact" id="contact">
         <div class="container">

            <div class="row contact_heading ">
               <div class="contact_heading_content col-md-6">
                  <p class="cline2">
                    Discutons de votre projet
                  </p>
                  <div class="contact_heading_content_img">
                     <lottie-player src="https://assets1.lottiefiles.com/packages/lf20_w6y7r1ap.json"
                        background="transparent" speed="1" loop autoplay></lottie-player>
                  </div>
               </div>
               <div class="contact_heading_svg col-md-6">
                  <lottie-player src="https://assets7.lottiefiles.com/packages/lf20_w7x9i6ag.json"
                     background="transparent" speed="1" loop autoplay></lottie-player>
               </div>
            </div>
         </div>


         <div class="circular_box">
            <div class="contact_actions">
               <div class="contact_action contact_action_github">
                  <div class="contact_label contact_label_github">
                     <span>Cliquez ici pour voir mon compte GitHub</span>
                     <b aria-hidden="true">↓</b>
                  </div>
                  <a class="contact_icons" href="https://github.com/Idiamin321" target="_blank" rel="noopener noreferrer" aria-label="Cliquer ici pour voir mon compte GitHub">

                        background="transparent" speed="2" loop autoplay></lottie-player>
                  </a>
               </div>

               <div class="contact_action contact_action_mail">
                  <a class="contact_icons" href="mailto:abdoul-dev@e-webcode.fr" aria-label="Cliquer ici pour m'envoyer un e-mail">
                     <lottie-player class="gmail" src="https://assets10.lottiefiles.com/packages/lf20_a0reautd.json"
                        background="transparent" speed="1" loop autoplay></lottie-player>
                  </a>
                  <div class="contact_label contact_label_mail">

                     <span>Cliquez ici pour m'envoyer un e-mail</span>
                  </div>
               </div>
            </div>
